version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      model-and-mcp-sdks:
        patterns:
          - "anthropic"
          - "openai"
          - "httpx2"
          - "fastmcp"
          - "mcp"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
