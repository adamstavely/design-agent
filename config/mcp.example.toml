# MCP servers the agent may use (src/design_agent/tools/mcp.py). Copy to config/mcp.toml
# (Git-ignored) and uncomment what you want. docs/integrations.md walks through it.
# Names are lowercase letters and digits; tools are named `{server}_{tool}`.
#
# A server signs in with headers read from the host environment (`headers_env`): one account for
# everyone who uses the agent, usually a service account or an API token. Header values never
# enter the sandbox.

# --- Hosted integrations (official MCP servers) -------------------------------------------------

# Notion: pages, databases and comments (briefs, launch docs, content calendars).
# [servers.notion]
# url = "https://mcp.notion.com/mcp"
# headers_env = { Authorization = "NOTION_MCP_AUTHORIZATION" }   # "Bearer <token>"

# Linear: issues, projects and comments (design requests, specs).
# [servers.linear]
# url = "https://mcp.linear.app/mcp"
# headers_env = { Authorization = "LINEAR_MCP_AUTHORIZATION" }   # "Bearer <api key>"

# GitHub: repositories, pull requests and issues (release notes, PR explainers).
# [servers.github]
# url = "https://api.githubcopilot.com/mcp/"
# headers_env = { Authorization = "GITHUB_MCP_AUTHORIZATION" }   # "Bearer <personal access token>"

# Figma: frames, components and variables from design files. Figma admits only clients in its MCP
# catalog to the remote server; check yours is listed.
# [servers.figma]
# url = "https://mcp.figma.com/mcp"
# headers_env = { Authorization = "FIGMA_MCP_AUTHORIZATION" }

# --- Your own servers ---------------------------------------------------------------------------

# A server of your own, read-only docs search with a shared token:
# [servers.docs]
# url = "https://docs.example.com/mcp"
# transport = "http"                                # or "sse"
# headers_env = { Authorization = "DOCS_MCP_AUTHORIZATION" }
# include_tools = ["search"]
# timeout = 30
# always_shown = false
#
# A local app's own stdio server:
# [servers.notes]
# transport = "stdio"
# command = ["notes-app", "mcp"]
#
# Paper is configured with PAPER_* in .env (docs/partners/paper.md), not here.
