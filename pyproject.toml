[project]
name = "design-agent"
version = "0.1.0.dev0"
description = "On-brand design and motion from a chat thread."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["design", "motion", "agent", "claude", "hyperframes", "paper", "slack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    # Model providers, through their own SDKs (src/design_agent/kit/models/).
    "anthropic>=1.15,<2",
    "openai>=3.35,<4",
    # MCP servers' tools (kit/mcp.py) and the Paper bridge.
    "fastmcp>=4.1,<5",
    "mcp>=2.3,<3",
    "httpx>=0.28.1,<1",
    # The provider SDKs' transport; model_retry classifies its errors.
    "httpx2>=2.13,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "python-dotenv>=1.2,<2",
    "typing-extensions>=4.12,<5",
    # SKILL.md front matter.
    "pyyaml>=6,<7",
    "click>=8.2,<9",
    # Tool arguments in dict-form JSON schema are validated by the host guard.
    "jsonschema>=4.23,<5",
    # Image clamp, contact sheets and the look tool's resize.
    "pillow>=12,<14",
    # Self-hosted API, Paper bridge and the optional local setup console.
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "python-multipart>=0.0.20,<1",
]

[project.urls]
Repository = "https://github.com/adamstavely/design-agent"
Changelog = "https://github.com/adamstavely/design-agent/blob/main/CHANGELOG.md"
Security = "https://github.com/adamstavely/design-agent/blob/main/SECURITY.md"

[project.scripts]
design-agent = "design_agent.cli:main"

[project.optional-dependencies]
# Self-hosted path: Postgres persistence and the production ASGI server.
self-host = [
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn[standard]>=0.35,<1",
]
slack = ["slack-bolt>=1.30,<2", "slack-sdk>=3.45,<4", "aiohttp>=3.9,<4"]

[dependency-groups]
dev = [
    "mypy>=1.17,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "render: needs the sandbox image (docker); run by the CI render job",
    "live: calls a live provider; needs DESIGN_AGENT_LIVE_TESTS=1",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored skills are never patched (skills-lock.json); tests/unit/test_skills_lock.py keeps this
# list equal to the lock's.
extend-exclude = [
  ".venv",
  ".mda",
  "skills/embedded-captions",
  "skills/faceless-explainer",
  "skills/general-video",
  "skills/hyperframes",
  "skills/hyperframes-animation",
  "skills/hyperframes-audio",
  "skills/hyperframes-cli",
  "skills/hyperframes-core",
  "skills/hyperframes-creative",
  "skills/hyperframes-keyframes",
  "skills/hyperframes-registry",
  "skills/media-use",
  "skills/motion-graphics",
  "skills/music-to-video",
  "skills/pr-to-video",
  "skills/remotion-to-hyperframes",
  "skills/slideshow",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "TID", "ARG", "S", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607", "ARG001", "ARG002", "ARG005"]
# Paths inside the sandbox container, not this host's temp directory.
"src/design_agent/runtime/sandbox/*" = ["S108"]
"src/design_agent/middleware/workspace.py" = ["S108"]
"scripts/**" = ["S603", "S607"]
# The runtime keeps its interfaces' full signatures (hooks a subclass overrides, provider options).
"src/design_agent/kit/**" = ["ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
